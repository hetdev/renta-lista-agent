[project]
name = "rentalista"
version = "0.1.0"
description = "RentaLista: evidence-first Colombian income tax agent"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "bedrock-agentcore>=1.23.0",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "mangum>=0.22.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pypdf>=6.18.1",
  "pyyaml>=6.0.3",
  "reportlab>=5.0.1",
  "strands-agents>=1.55.1",
  "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
rentalista-rules = "rentalista.rules.validator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rentalista"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["rentalista"]
mypy_path = "src"

[tool.coverage.run]
source = ["rentalista"]
branch = true
